---
layout: default
---

<article class="journal-entry">
  <h1>{{ page.title }}</h1>
  <p class="entry-meta">
    <i><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time></i>
  </p>

  {{ content }}
</article>

<p class="entry-back"><a href="{{ '/journal' | relative_url }}">← all journal entries</a></p>
